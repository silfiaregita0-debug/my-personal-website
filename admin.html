<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little World | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f4ee;
      color: #292621;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: 60px auto;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 40px;
    }

    .box {
      background: white;
      padding: 30px;
      border: 1px solid #e5e0d8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8d2c8;
      background: #fff;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    button {
      margin-top: 22px;
      padding: 14px 24px;
      border: none;
      background: #292621;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
    }

    .logout {
      background: transparent;
      color: #292621;
      border: 1px solid #292621;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>My little archive.</h1>
    <p class="subtitle">
      A private place to add stories to My Little World.
    </p>

    <!-- LOGIN -->
    <div id="loginBox" class="box">

      <h2>Welcome back.</h2>

      <label>Email</label>
      <input type="email" id="email" placeholder="Your email">

      <label>Password</label>
      <input type="password" id="password" placeholder="Your password">

      <button onclick="login()">Enter</button>

      <div id="loginMessage"></div>

    </div>

    <!-- ADMIN -->
    <div id="adminBox" class="box hidden">

      <h2>New story</h2>

      <label>Title</label>
      <input
        type="text"
        id="title"
        placeholder="My first month in Japan"
      >

      <label>Story</label>
      <textarea
        id="content"
        placeholder="Write whatever you want to remember..."
      ></textarea>

      <button id="saveButton" onclick="saveStory()">
  Publish story
</button>

<button
  id="cancelEditButton"
  class="logout hidden"
  onclick="cancelEdit()"
>
  Cancel edit
</button>

<div id="message"></div>

<hr style="margin: 35px 0; border: 0; border-top: 1px solid #e5e0d8;">

<h2>My stories</h2>

<div id="storiesList">
  Loading stories...
</div>

<button class="logout" onclick="logout()">Log out</button>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

<script>
let editingId = null;

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");

  loadStories();
}

async function loadStories() {
  const list = document.getElementById("storiesList");
  list.textContent = "Loading stories...";

  const { data, error } = await supabaseClient
    .from("Stories")
    .select('id, "Title", "Content", created_at')
    .order("created_at", { ascending: false });

  if (error) {
    list.textContent = "Could not load stories: " + error.message;
    return;
  }

  list.replaceChildren();

  if (!data || data.length === 0) {
    list.textContent = "No stories yet.";
    return;
  }

  data.forEach(story => {
    const card = document.createElement("div");
    card.className = "box";

    const heading = document.createElement("h3");
    heading.textContent = story.Title;

    const preview = document.createElement("p");
    preview.textContent = story.Content;

    const editButton = document.createElement("button");
    editButton.textContent = "Edit";
    editButton.onclick = () => startEdit(story);

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "logout";
    deleteButton.style.marginLeft = "8px";
    deleteButton.onclick = () => deleteStory(story.id);

    card.append(heading, preview, editButton, deleteButton);
    list.appendChild(card);
  });
}

async function saveStory() {
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const message = document.getElementById("message");

  if (!title || !content) {
    message.textContent = "Please fill in the title and story.";
    return;
  }

  let result;

  if (editingId !== null) {
    result = await supabaseClient
      .from("Stories")
      .update({ Title: title, Content: content })
      .eq("id", editingId);
  } else {
    result = await supabaseClient
      .from("Stories")
      .insert([{ Title: title, Content: content }]);
  }

  if (result.error) {
    message.textContent = result.error.message;
    return;
  }

  message.textContent = editingId !== null
    ? "Story updated successfully!"
    : "Story published successfully!";

  cancelEdit();
  await loadStories();
}

function startEdit(story) {
  editingId = story.id;

  document.getElementById("title").value = story.Title || "";
  document.getElementById("content").value = story.Content || "";
  document.getElementById("saveButton").textContent = "Save changes";
  document.getElementById("cancelEditButton").classList.remove("hidden");
  document.getElementById("message").textContent = "Editing story...";
  window.scrollTo(0, 0);
}

function cancelEdit() {
  editingId = null;

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";
  document.getElementById("saveButton").textContent = "Publish story";
  document.getElementById("cancelEditButton").classList.add("hidden");
}

async function deleteStory(id) {
  const confirmed = confirm(
    "Are you sure you want to permanently delete this story?"
  );

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("Stories")
    .delete()
    .eq("id", id);

  const message = document.getElementById("message");

  if (error) {
    message.textContent = error.message;
    return;
  }

  if (editingId === id) cancelEdit();

  message.textContent = "Story deleted successfully.";
  await loadStories();
}

async function logout() {
  await supabaseClient.auth.signOut();

  document.getElementById("adminBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}
</script>

</body>
  </html>
